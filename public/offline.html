<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline — DevKit</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0f;
        color: #e4e4e7;
        font-family: system-ui, sans-serif;
        text-align: center;
      }
      .card {
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 0.5rem;
      }
      p {
        color: #a1a1aa;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You're offline</h1>
      <p>DevKit tools you've visited are still available.</p>
      <button onclick="location.reload()" style="padding: 0.5rem 1rem; border-radius: 8px; border: 1px solid #3f3f46; background: transparent; color: inherit; cursor: pointer;">
        Try again
      </button>
    </div>
  </body>
</html>
